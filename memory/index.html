<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ConsensusMemory</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-gray-950 text-white min-h-screen p-6"><div class="max-w-2xl mx-auto">
<h1 class="text-2xl font-bold mb-6">🧠 ConsensusMemory</h1>
<div class="bg-gray-900 rounded-xl p-6 mb-4 border border-gray-800 space-y-3">
<h2 class="text-cyan-400 font-semibold">Post a Fact</h2>
<input id="claim" placeholder="Factual claim..." class="w-full bg-gray-950 border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-600 outline-none">
<input id="source" placeholder="Source URL" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-600 outline-none">
<button class="w-full bg-cyan-600 hover:bg-cyan-700 rounded-lg py-3 font-bold">Submit for Validation</button>
</div>
<div class="bg-gray-900 rounded-xl p-6 border border-gray-800 space-y-3">
<h2 class="text-amber-400 font-semibold">Revalidate Fact</h2>
<input id="key" placeholder="Fact key" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-4 py-3 text-white placeholder-gray-600 outline-none">
<button class="w-full bg-amber-600 hover:bg-amber-700 rounded-lg py-3 font-bold">⟳ Revalidate</button>
</div>
</div></body></html>
